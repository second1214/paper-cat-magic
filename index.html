<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Paper Cat Magic</title>
    <style>
      :root { --ink: #3a2414; --paper: #fff8ec; --line: #d9c7ad; --accent: #e8772b; --muted: #8a7560; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2433; color: var(--ink);
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 18px; }
      .hud { position: fixed; pointer-events: none; }
      #top { top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
      #hearts { font-size: 26px; letter-spacing: 2px; text-shadow: 0 2px 0 #0006; }
      .heart { color: #5a4652; } .heart.full { color: #ff5f7e; } .heart.half { color: #ff9fb0; }
      #mana { width: 180px; height: 10px; background: #0005; border-radius: 6px; margin-top: 6px; overflow: hidden; border: 2px solid #fff8; }
      #manaFill { height: 100%; background: linear-gradient(90deg, #5aa9ff, #9fd8ff); }
      #room { color: #fff; font-weight: 700; background: #0005; padding: 4px 12px; border-radius: 999px; }
      #bottom { left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: #0006; padding: 8px 10px; border-radius: 14px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); }
      .wandName { color: #fff; font-size: 12px; margin-left: 6px; }
      #bagBtn { pointer-events: auto; position: fixed; right: 16px; bottom: 16px; }
      #hint { left: 50%; top: 56px; transform: translateX(-50%); color: #fff; background: #000a; padding: 6px 14px; border-radius: 999px; font-size: 14px; }
      .spell { width: 40px; height: 40px; border-radius: 10px; background: var(--paper); border: 3px solid var(--c, #ccc); display: grid; place-items: center; font-size: 20px; color: var(--c); box-shadow: 0 2px 0 #0004; }
      .spell span { filter: drop-shadow(0 1px 0 #0003); font-weight: 700; }
      .spell.empty { background: #fff3; border: 2px dashed #fff6; }
      .spell.cursor { outline: 3px solid #fff; outline-offset: 2px; }
      .spell.big { width: 56px; height: 56px; font-size: 28px; }
      .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #0007; padding: 16px; }
      .panel { background: var(--paper); border: 3px solid var(--line); border-radius: 18px; padding: 18px 20px; max-width: 640px; width: 100%; box-shadow: 0 10px 40px #0006; text-align: center; }
      .panel h2 { margin: 0 0 6px; } .panel h3 { margin: 14px 0 6px; font-size: 15px; }
      .muted { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
      .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      button { font: inherit; cursor: pointer; border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px; padding: 8px 14px; }
      button:hover { border-color: var(--accent); }
      .pick { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; min-width: 64px; }
      .pick.sel { border-color: var(--accent); background: #ffe9d6; }
      .card { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 170px; padding: 12px; }
      .close, .skip, .again { margin-top: 14px; }
      .desc { min-height: 1.4em; margin-top: 8px; font-size: 14px; }
      .stick { position: fixed; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; border: 3px solid #fff7; background: #fff2; pointer-events: none; }
      .stick > div { position: absolute; left: 30px; top: 30px; width: 40px; height: 40px; border-radius: 50%; background: #fffc; }
      #help { left: 16px; bottom: 16px; color: #fffb; font-size: 12px; line-height: 1.6; }
      @media (max-width: 700px) { #help { display: none; } .spell { width: 32px; height: 32px; font-size: 16px; } #mana { width: 120px; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading">読み込み中…</div>
    <div class="hud" id="top">
      <div><div id="hearts"></div><div id="mana"><div id="manaFill"></div></div></div>
      <div id="room"></div>
    </div>
    <div class="hud" id="hint" hidden>右の出口へ進もう →</div>
    <div class="hud" id="bottom"><div id="slots" style="display:flex;gap:6px;align-items:center"></div></div>
    <div class="hud" id="help">WASD 移動 / マウス 狙う・クリック 発射<br />Space ダッシュ / Tab 杖の編集</div>
    <button id="bagBtn">杖</button>
    <div class="overlay" id="bag" hidden></div>
    <div class="overlay" id="reward" hidden></div>
    <div class="overlay" id="result" hidden></div>
    <div class="stick" id="stickL" hidden><div></div></div>
    <div class="stick" id="stickR" hidden><div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
