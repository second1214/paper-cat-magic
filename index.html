<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>My Cat Is So Cute</title>
    <style>
      :root { --ink: #3a2414; --paper: #fff8ec; --line: #d9c7ad; --accent: #e8772b; --muted: #8a7560; --atk: #d9480f; --mod: #1c7ed6; --cell: 46px; --gap: 6px; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2433; color: var(--ink);
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 18px; }
      .hud { position: fixed; pointer-events: none; }

      /* 上の帯 */
      #status { top: 8px; left: 12px; }
      #hearts { font-size: 24px; letter-spacing: 1px; text-shadow: 0 2px 0 #0006; line-height: 1; }
      .heart { color: #5a4652; } .heart.full { color: #ff5f7e; } .heart.half { color: #ff9fb0; }
      #manaWrap { display: flex; gap: 6px; align-items: center; color: #fff; font-size: 11px; margin-top: 4px; }
      #mana { width: 150px; height: 10px; background: #0005; border-radius: 6px; overflow: hidden; border: 2px solid #fff8; }
      #manaFill { height: 100%; background: linear-gradient(90deg, #3fa7ff, #9fd8ff); }
      #roomBox { top: 8px; right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
      #room { color: #fff; font-weight: 700; background: #0006; padding: 4px 12px; border-radius: 999px; font-size: 14px; }
      #roomBox .row { display: flex; gap: 6px; }
      #bagBtn, #pauseBtn { pointer-events: auto; font-weight: 700; }
      #pauseBtn, #muteBtn { width: 40px; padding: 8px 0; }
      #muteBtn { pointer-events: auto; font-weight: 700; }
      body.titling #roomBox { visibility: visible; z-index: 20; } body.titling #room, body.titling #bagBtn, body.titling #pauseBtn { visibility: hidden; }
      body.titling #status, body.titling #slots, body.titling #help, body.titling .tbtn, body.titling #hint { visibility: hidden; }
      #slots { left: 50%; top: 6px; transform: translateX(-50%); display: flex; align-items: flex-start; gap: 8px; background: #0007; padding: 6px 10px 2px; border-radius: 14px; }
      #slots .toyIcon { width: 40px; height: 40px; margin-top: 3px; }
      #slots .rest { color: #ffd8a8; font-size: 11px; align-self: center; }
      .toySws { display: flex; flex-direction: column; gap: 3px; }
      .toySw { pointer-events: auto; position: relative; width: 30px; height: 30px; padding: 2px; border-radius: 8px; background: #fff3; border: 2px solid #fff6; }
      .toySw img { width: 100%; height: 100%; opacity: .75; }
      .toySw span { position: absolute; right: -4px; bottom: -4px; font-size: 9px; font-weight: 800; color: #fff; background: #3a2414; border-radius: 5px; padding: 0 3px; }
      #hint { left: 50%; bottom: 12px; transform: translateX(-50%); color: #fff; background: #000b; padding: 6px 12px; border-radius: 14px; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
      #hint .chip { display: inline-flex; align-items: center; gap: 4px; background: #fff2; border-radius: 999px; padding: 2px 8px 2px 2px; }
      #hint .chip img { width: 26px; height: 26px; }
      #toast { left: 50%; top: 27%; transform: translate(-50%, -50%); max-width: min(80vw, 560px); text-align: center; pointer-events: none; background: #fff; border: 3px solid var(--accent); color: var(--ink); font-weight: 800; font-size: 16px; padding: 6px 16px; border-radius: 16px; box-shadow: 0 6px 20px #0006; }
      #help { left: 12px; bottom: 12px; color: #fffb; font-size: 12px; line-height: 1.6; }

      /* スロット（技＝赤い実線、修飾＝青い点線＋右向き矢印） */
      .slotrow { position: relative; padding-bottom: 20px; }
      .cells { display: flex; gap: var(--gap); }
      .cell { position: relative; width: var(--cell); height: var(--cell); padding: 0; border-radius: 10px; background: var(--paper); display: grid; place-items: center; border: 3px solid var(--c, #ccc); cursor: pointer; }
      .cell img { width: 82%; height: 82%; object-fit: contain; pointer-events: none; }
      .cell .badge { position: absolute; top: -8px; left: -6px; font-size: 9px; font-weight: 800; color: #fff; padding: 1px 4px; border-radius: 6px; pointer-events: none; }
      .cell.atk { border-color: #e8590c; } .cell.atk .badge { background: var(--atk); }
      .cell.mod { border: 3px dashed var(--mod); border-radius: 50% 10px 10px 50%; } .cell.mod .badge { background: var(--mod); }
      .cell .arrow { position: absolute; right: -11px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--mod); text-shadow: 0 0 2px #fff, 0 0 2px #fff; pointer-events: none; }
      .cell.mod.dir-left { border-radius: 10px 50% 50% 10px; } .cell.dir-left .arrow { right: auto; left: -11px; }
      .cell.mod.dir-both { border-radius: 50%; } .cell.dir-both .arrow { right: 50%; top: auto; bottom: -9px; transform: translateX(50%); font-size: 10px; letter-spacing: -1px; }
      .cell.mod.dir-all { border: 3px double var(--mod); border-radius: 12px; } .cell.dir-all .arrow { right: -6px; top: -6px; transform: none; font-size: 10px; font-weight: 900; color: #fff; background: var(--mod); border-radius: 6px; padding: 0 3px; text-shadow: none; }
      .cell.rar2::after, .cell.rar3::after { content: ""; position: absolute; inset: auto 6px -3px; height: 4px; border-radius: 2px; background: #ae3ec9; pointer-events: none; }
      .cell.rar3::after { background: #f59f00; box-shadow: 0 0 4px #ffd43b; }
      .cell.empty { background: #fff2; border: 2px dashed #fff7; }
      .panel .cell.empty { background: #f3e9d9; border-color: #cdb894; }
      .cell.mini { --cell: 26px; width: 26px; height: 26px; border-width: 2px; } .cell.mini .badge, .cell.mini .arrow, .cell.mini .stars { display: none; }
      .subTop { display: flex; align-items: center; gap: 3px; margin: 0 0 4px; } .subTop > span { font-size: 10px; font-weight: 800; color: #ffd43b; white-space: nowrap; }
      .meter { position: relative; width: 60px; height: 7px; border-radius: 4px; background: #0006; overflow: hidden; border: 1px solid #fff6; }
      .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #ffd43b, #ff922b); }
      .batts { display: flex; flex-direction: column; gap: 3px; align-self: center; }
      .batt { display: flex; align-items: center; gap: 3px; } .batt img { width: 26px; height: 26px; } .batt .meter { width: 30px; } .batt .meter i { background: #69db7c; }
      .subrow { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; } .subrow .meter { width: 70px; height: 9px; border-color: #b8a07c; background: #e9dcc6; }
      .sublabel { font-size: 12px; font-weight: 800; color: #e8590c; display: flex; flex-direction: column; } .sublabel small { font-size: 10px; color: var(--muted); font-weight: 600; }
      .card.locked { opacity: .9; } .qmark { width: 54px; height: 54px; flex: none; display: grid; place-items: center; font-size: 30px; font-weight: 900; background: #e9ecef; border-radius: 12px; color: #868e96; }
      .cell.lockedCell img { filter: brightness(0) opacity(.35); } .cell.lockedCell .badge, .cell.lockedCell .arrow { opacity: .3; }
      .pre { font-size: 12px; color: #2b8a3e; font-weight: 700; }
      .card.pact { background: #f3f0ff; border-color: #7048e8; } .card.pact .card { border: none; padding: 4px; background: #fff; }
      .cursebox { background: #5f3dc4; color: #fff; border-radius: 10px; padding: 4px 8px; } .cursebox b { display: block; } .cursebox small { font-size: 11px; opacity: .9; }
      .pactget { font-size: 12px; font-weight: 800; color: #5f3dc4; }
      .pact .setbox, .pact .card .desc { display: none; } .bench .fusion > b { display: none; }
      .fuseBag { display: flex; flex-wrap: wrap; gap: var(--gap); margin: 6px 0; max-height: 140px; overflow: auto; padding: 10px 4px 4px; }
      .cell.dim { opacity: .3; cursor: default; }
      .fusion .fuseGo { padding: 6px 14px; }
      .curses { display: flex; flex-wrap: wrap; gap: 6px; } .curse { background: #5f3dc4; color: #fff; border-radius: 8px; padding: 3px 8px; font-size: 12px; } .curse b { margin-right: 6px; }
      .opened { background: #fff3bf; border: 2px solid #fab005; border-radius: 12px; padding: 6px 10px; margin: 4px 0 8px; } .opened .zcells { justify-content: center; margin: 4px 0; } .opened small { font-size: 12px; }
      .cell.sel { outline: 4px solid var(--accent); outline-offset: 2px; transform: translateY(-3px); }
      .glines { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; }
      .gline { position: absolute; bottom: 2px; height: 14px; left: calc(var(--s) * (var(--cell) + var(--gap))); width: calc(var(--n) * (var(--cell) + var(--gap)) - var(--gap));
        border: 2px solid #ffffff99; border-top: 0; border-radius: 0 0 8px 8px; display: flex; justify-content: center; }
      .gline span { position: relative; top: 6px; font-size: 10px; font-weight: 800; color: #fff; background: #3a2414; border-radius: 6px; padding: 0 5px; white-space: nowrap; }
      .gline.next { border-color: #ffd43b; } .gline.next span { background: #e8590c; }
      .panel .gline { border-color: #b8a07c; } .panel .gline span { background: #6b4f3a; }

      /* 画面（パネル） */
      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0008; padding: 8px; }
      .panel { background: var(--paper); border: 3px solid var(--line); border-radius: 18px; padding: 14px 16px; width: min(900px, 100%); max-height: calc(100dvh - 16px); overflow-x: hidden; overflow-y: auto; box-shadow: 0 10px 40px #0006; text-align: center; }
      .panel h2 { margin: 0 0 4px; font-size: 20px; } .panel h3 { margin: 6px 0; font-size: 15px; }
      .muted { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
      button { font: inherit; cursor: pointer; border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px; padding: 8px 14px; }
      button:hover { border-color: var(--accent); }
      .go { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; padding: 10px 28px; margin-top: 10px; }
      .close, .skip, .again { margin-top: 10px; }

      /* ママ */
      .mama { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 2px 0 6px; }
      .mama img { height: 130px; width: auto; filter: drop-shadow(0 3px 4px #0003); }
      .mama.small img { height: 64px; }
      .mama .say { position: relative; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; font-weight: 700; font-size: 14px; text-align: left; }

      /* アイテムの説明カード */
      .card { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
      .choices .card { cursor: pointer; flex: 1 1 0; min-width: 0; max-width: 260px; }
      .choices .card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px #e8772b44; }
      .card .head { display: flex; gap: 8px; align-items: center; }
      .card .head img { width: 54px; height: 54px; flex: none; }
      .card .head b { display: block; font-size: 17px; }
      .tag { font-size: 11px; font-weight: 800; color: #fff; padding: 1px 6px; border-radius: 6px; }
      .tag.atk { background: var(--atk); } .tag.mod { background: var(--mod); } .tag.toy { background: #9c36b5; }
      .stats { width: 100%; border-collapse: collapse; font-size: 13px; }
      .stats th { text-align: left; font-weight: 600; color: var(--muted); padding: 1px 0; }
      .stats td { text-align: right; font-weight: 800; }
      .stats tr + tr { border-top: 1px dashed #eadfcd; }
      .desc { margin: 0; font-size: 12px; color: #5a4636; }
      .elem { margin: 0; display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: #5a4636; border-left: 4px solid var(--c); padding-left: 6px; }
      .elem img { width: 26px; height: 26px; flex: none; }
      .choices { display: flex; gap: 10px; justify-content: center; align-items: stretch; }
      .rhead { display: flex; gap: 12px; align-items: center; justify-content: center; text-align: left; }
      .rhead .mama { margin: 0; }

      /* はじめに */
      .intro .cols { display: grid; grid-template-columns: 1fr 1.2fr; gap: 14px; text-align: left; align-items: start; }
      .howto { display: grid; gap: 4px; background: #f3e9d9; border-radius: 12px; padding: 8px 10px; font-size: 13px; }
      .howto b { display: inline-block; min-width: 3.5em; color: var(--atk); }
      .k { display: inline-block; background: var(--atk); color: #fff; border-radius: 6px; padding: 0 6px; font-weight: 700; }
      .rules p { font-size: 13px; line-height: 1.6; margin: 4px 0; }
      .example { display: flex; gap: 12px; align-items: center; font-size: 12px; margin: 6px 0; }
      .example .cell { pointer-events: none; }

      /* タイトル */
      #intro { background: radial-gradient(ellipse at center, #2b243388 0%, #1c1622ee 75%); }
      .title { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #fff; text-align: center; width: min(560px, 100%); }
      .logo { font-size: clamp(34px, 10vw, 56px); font-weight: 900; letter-spacing: 1px; line-height: 1.0; color: #fff4dc; font-family: "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
        text-shadow: 0 3px 0 #e8772b, 0 6px 0 #6b3a1a, 0 10px 18px #0008; }
      .logo small { display: block; font-size: 0.42em; color: #ffd8a8; text-shadow: 0 2px 0 #6b3a1a; margin-bottom: 4px; letter-spacing: 3px; }
      /* ママ（奥・大きく）の前に猫が座り、虫がやってくる。猫はママの腰くらいの大きさ */
      .hero { position: relative; height: clamp(150px, 30vh, 250px); aspect-ratio: 1.25; }
      .hero img { position: absolute; width: auto; filter: drop-shadow(0 6px 8px #0007); }
      .hero .mom { height: 100%; left: 2%; bottom: 0; }
      .hero .cat { height: 52%; left: 38%; bottom: 0; z-index: 2; }   /* ママの前で虫に立ちはだかる */
      .hero .bug { height: 15%; z-index: 3; }
      .hero .b1 { right: 0; bottom: 2%; transform: scaleX(-1); }
      .hero .b2 { right: 4%; top: 18%; height: 17%; transform: scaleX(-1) rotate(-8deg); }
      .menu { display: flex; flex-direction: column; gap: 8px; width: min(260px, 80vw); }
      .menu button { font-size: 17px; font-weight: 800; padding: 10px; margin: 0; }
      .record { font-size: 12px; color: #fffc; background: #0006; border-radius: 999px; padding: 4px 12px; }
      .record b { color: #ffd43b; }
      .back { margin-top: 10px; }
      .pausePanel { width: min(360px, 100%); } .pausePanel .menu { margin: 10px auto 4px; }
      #result .menu { flex-direction: row; justify-content: center; width: auto; margin-top: 8px; }
      #result .menu button { font-size: 15px; padding: 8px 18px; }

      /* お金・お店・さいご */
      #coins { display: flex; align-items: center; gap: 3px; color: #ffe8cc; font-weight: 800; font-size: 14px; margin-top: 3px; text-shadow: 0 1px 0 #0008; }
      #coins img { width: 20px; height: 20px; }
      .shopPanel { width: min(860px, 100%); text-align: left; }
      .shead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
      .shead h2 { margin: 0; } .shead .close { margin: 0 0 0 auto; }
      .wallet { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-size: 18px; color: #e8590c; }
      .wallet img, .sitem button img, .reroll img { width: 18px; height: 18px; vertical-align: -3px; }
      .reroll { font-size: 12px; font-weight: 700; }
      .sitems { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .sitem { display: flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 5px 6px; }
      .sitem.sold { opacity: .45; }
      .sitem .cell { pointer-events: none; flex: none; }
      .potion { width: var(--cell); height: var(--cell); display: grid; place-items: center; font-size: 26px; background: #e7f5ff; border-radius: 10px; border: 3px solid #74c0fc; flex: none; }
      .sname { flex: 1; min-width: 0; } .sname b { font-size: 13px; display: block; } .sname small { font-size: 10.5px; color: var(--muted); display: block; line-height: 1.3; max-height: 2.6em; overflow: hidden; }
      .sitem button { padding: 4px 8px; font-weight: 800; white-space: nowrap; } .sitem button:disabled, .reroll:disabled { opacity: .5; }
      .forge { margin-top: 8px; background: #f3e9d9; border-radius: 12px; padding: 6px 8px; }
      .forge b { margin-right: 8px; } .fcells { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
      .fbtn { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; font-size: 12px; font-weight: 700; background: #fff; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
      .fbtn:hover { border-color: var(--accent); }
      .fbtn .cell { pointer-events: none; }
      .cell .stars { position: absolute; right: -4px; bottom: -6px; font-size: 11px; color: #f59f00; text-shadow: 0 0 2px #fff, 0 0 2px #fff; pointer-events: none; }
      #finalHint { display: none; left: 50%; bottom: 14px; transform: translateX(-50%); color: #fff; background: #e64980cc; padding: 6px 14px; border-radius: 999px; font-weight: 800; font-size: 14px; }
      body.final #finalHint { display: block; } body.final #slots { opacity: .35; }
      body.touch.final #finalHint { bottom: auto; top: 76px; }

      /* 難易度・ねこの成長・レアリティ */
      .diffPanel, .growPanel { width: min(560px, 100%); }
      .diffs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0; }
      .diff { display: flex; flex-direction: column; gap: 2px; padding: 10px; text-align: left; }
      .diff b { font-size: 16px; } .diff small { font-size: 11px; opacity: .85; }
      .diff:disabled { opacity: .45; cursor: not-allowed; }
      .grows { display: grid; gap: 6px; margin: 8px 0; text-align: left; }
      .grow { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 6px 10px; }
      .grow b { margin-right: 8px; } .grow small { display: block; font-size: 11px; color: var(--muted); }
      .grow .lv { color: var(--accent); letter-spacing: 2px; font-size: 12px; }
      .grow button { white-space: nowrap; font-weight: 700; } .grow button:disabled { opacity: .5; }
      .nib, .nibline b { color: #e8590c; }
      .nibline { font-size: 13px; margin: 2px 0 6px; }
      .card.rar1, .card.rar2, .card.rar3 { border-color: var(--r); box-shadow: 0 0 0 2px color-mix(in srgb, var(--r) 30%, transparent); }
      .card.rar3 { background: linear-gradient(160deg, #fff9db, #fff 40%); }
      .fxline { font-size: 11.5px; font-weight: 800; color: #ae3ec9; }
      .card .head .tag + .tag { margin-left: 4px; }

      /* ずかん */
      .zgroups { display: flex; flex-wrap: wrap; gap: 6px 14px; overflow-y: auto; max-height: calc(100dvh - 110px); padding: 8px 4px 4px; touch-action: pan-y; }
      .zgroup { margin-bottom: 2px; }
      .zukan .boardHead .back { margin: 0 0 0 auto; padding: 4px 14px; }
      .ztitle { font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 3px; }
      .zcells { display: flex; flex-wrap: wrap; gap: var(--gap); }
      .cell.toy { border-color: #9c36b5; }

      /* 持ち物（タブ・装備・レリック） */
      .tabs { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
      .tab { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px 4px 4px; font-size: 13px; font-weight: 700; background: #f3e9d9; }
      .tab img { width: 26px; height: 26px; }
      .tab small { font-size: 9px; color: #fff; background: var(--accent); border-radius: 5px; padding: 0 4px; margin-left: 2px; }
      .tab.on { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 2px #e8772b55; }
      .tabs .close { margin: 0 0 0 auto; padding: 4px 14px; }
      @media (max-width: 600px) { .tab:not(.on) { font-size: 0; gap: 0; padding: 3px; } .tab:not(.on) small { display: none; } }
      .gearRow { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
      .gslot { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--muted); gap: 2px; }
      .sets { display: grid; gap: 3px; flex: 1; min-width: 180px; }
      .setline { font-size: 11px; color: var(--muted); border-left: 4px solid var(--c, #ccc); padding-left: 6px; }
      .setline b { margin-right: 6px; color: var(--ink); }
      .setline.on { color: var(--ink); background: #fff3bf; }
      .setbox { border: 2px solid var(--c); border-radius: 10px; padding: 4px 6px; display: grid; gap: 2px; }
      .setbox .setline { border-left: 0; padding-left: 0; }
      .setname { font-size: 12px; font-weight: 800; color: var(--c); }
      .tag.relic { background: #12b886; }
      .cell.relic { border-color: #12b886; } .cell.gear { border-color: var(--c); }

      /* おもちゃの編集 */
      .edit { display: grid; grid-template-columns: 240px 1fr; gap: 14px; align-items: start; text-align: left; }
      .boardHead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
      .boardHead b { font-size: 17px; }
      .bagTitle { font-weight: 700; font-size: 13px; margin: 8px 0 6px; }
      .baggrid { display: grid; grid-template-columns: repeat(8, var(--cell)); gap: var(--gap); }

      /* タッチ用ボタン（スマホのみ表示） */
      #stick { position: fixed; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; border: 3px solid #fff7; background: #fff2; pointer-events: none; }
      #stick > div { position: absolute; left: 30px; top: 30px; width: 40px; height: 40px; border-radius: 50%; background: #fffc; }
      .tbtn { display: none; position: fixed; border-radius: 50%; border: 3px solid #fff; color: #fff; font-weight: 800; touch-action: none; user-select: none; -webkit-user-select: none; }
      body.touch .tbtn { display: grid; place-items: center; }
      body.touch #help { display: none; }
      #atkBtn { right: 18px; bottom: 22px; width: 88px; height: 88px; background: #d9480fcc; font-size: 20px; }
      #dashBtn { right: 116px; bottom: 30px; width: 62px; height: 62px; background: #1c7ed6cc; font-size: 13px; }
      .tbtn.on { transform: scale(.92); filter: brightness(1.2); }
      body.touch #hint { bottom: auto; top: 76px; }

      /* 低い画面（スマホ横持ち） */
      @media (max-height: 520px) {
        :root { --cell: 36px; --gap: 5px; }
        #hearts { font-size: 18px; } #mana { width: 100px; height: 8px; } #room { font-size: 12px; }
        #slots .toyIcon { width: 30px; height: 30px; }
        .panel { padding: 8px 12px; } .panel h2 { font-size: 16px; }
        .mama img { height: 84px; } .mama.small img { height: 46px; } .mama .say { font-size: 12px; }
        .card { padding: 6px 8px; gap: 3px; } .card .head img { width: 38px; height: 38px; } .card .head b { font-size: 14px; }
        .stats { font-size: 11px; } .desc { font-size: 11px; }
        .rules p { font-size: 11.5px; line-height: 1.45; } .howto { font-size: 11.5px; }
        .edit { grid-template-columns: 200px 1fr; gap: 10px; }
        .go, .close, .skip, .again { margin-top: 6px; padding: 6px 16px; }
        .title { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 6px 18px; width: min(820px, 100%); }
        .logo { width: 100%; font-size: 34px; } .logo br { display: none; }
        .hero { height: 52vh; } .menu { width: 220px; } .menu button { padding: 7px; font-size: 15px; }
        .record { width: 100%; max-width: max-content; }
        .zgroup { margin-bottom: 3px; } .ztitle { font-size: 11px; }
        .diffs { gap: 5px; margin: 4px 0; } .diff { padding: 6px 8px; } .grows { gap: 4px; margin: 4px 0; grid-template-columns: 1fr 1fr; } .grow { padding: 3px 8px; }
        .growPanel { width: min(760px, 100%); } .growPanel .back { margin-top: 2px; }
        .sitems { grid-template-columns: repeat(3, 1fr); gap: 4px; } .sitem { padding: 3px 4px; } .forge { margin-top: 4px; padding: 4px 6px; }
        .tabs { margin-bottom: 4px; } .tab { padding: 2px 8px 2px 2px; font-size: 11px; } .tab img { width: 22px; height: 22px; }
      }
      @media (max-width: 460px) {
        :root { --cell: 36px; --gap: 5px; }
        .baggrid { grid-template-columns: repeat(8, var(--cell)); }
        .rhead .mama .say { display: none; }
        .edit .detail .card { padding: 6px 8px; }
      }
      @media (max-width: 700px) {
        .sitems { grid-template-columns: 1fr 1fr; }
        .zgroups { max-height: calc(100dvh - 400px); }
        .intro .cols, .edit { grid-template-columns: 1fr; }
        .choices { flex-direction: column; align-items: center; } .choices .card { width: 100%; max-width: none; }
        #slots { top: auto; bottom: 120px; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading">読み込み中…</div>
    <div class="hud" id="status"><div id="hearts"></div><div id="manaWrap"><span>やる気</span><div id="mana"><div id="manaFill"></div></div><span id="manaNum"></span></div><div id="coins"></div></div>
    <div class="hud" id="slots"></div>
    <div class="hud" id="roomBox"><div id="room"></div><div class="row"><button id="bagBtn">持ち物</button><button id="muteBtn" aria-label="音">♪</button><button id="pauseBtn" aria-label="一時停止">Ⅱ</button></div></div>
    <div class="hud" id="hint" hidden></div>
    <div class="hud" id="toast" hidden></div>
    <div class="hud" id="help">WASD 移動 ／ クリック長押し 攻撃 ／ J 自動で狙う<br />Space ダッシュ ／ Q 持ち替え ／ Tab 持ち物</div>
    <div class="tbtn" id="atkBtn">攻撃</div>
    <div class="tbtn" id="dashBtn">ダッシュ</div>
    <div class="overlay" id="bag" hidden></div>
    <div class="overlay" id="reward" hidden></div>
    <div class="overlay" id="result" hidden></div>
    <div id="stick" hidden><div></div></div>
    <div class="overlay" id="shopPanel" hidden></div>
    <div class="hud" id="finalHint">肉球ペシペシしかできない！ ママから逃げて…</div>
    <div class="overlay" id="pause" hidden></div>
    <div class="overlay" id="intro" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
